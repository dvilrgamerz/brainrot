name: BrainForge V2 CI

on:
  push:
    branches: [main, feat/*]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check service worker and all JS modules
        run: node --check sw.js js/*.js
      - name: Run all unit and integration test suites
        run: node --test tests/*.test.mjs
      - name: Validate static assets and icons
        run: |
          test -s index.html
          test -s styles.css
          test -s manifest.webmanifest
          test -s assets/icons/icon-192.svg
          test -s assets/icons/icon-512.svg
